# =============================================================================
# Hardware: 2x BTT SKR Mini E3 V3 (TMC2209 drivers)
# Homing: Sensorless (StallGuard via TMC2209 DIAG pins)
# make sure you have a yth
#
# WIRING NOTES:
#   stepper_x  -> Board 1, port: EM  (E motor port)
#   stepper_x1 -> Board 1, port: ZM  (Z motor port)
#   stepper_y  -> Board 1, port: YM  (Y motor port)
#   stepper_y1 -> Board 1, port: XM  (X motor port)

#   stepper_e -> Board 2, port: XM  (X motor port)
#   stepper_z  -> Board 2, port: YM  (Y motor port)



[include mainsail.cfg]
[include macros.cfg]
# =============================================================================

# -----------------------------------------------------------------------------
# MCU
# Replace the serial path with your actual device path.
# Run: ls /dev/serial/by-id/ to find it.
# -----------------------------------------------------------------------------
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_4200090007504E5238363120-if00

[mcu mcu2]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_200021000650414235363020-if00

[force_move]
enable_force_move: true

# -----------------------------------------------------------------------------
# PRINTER / KINEMATICS
# -----------------------------------------------------------------------------
[printer]
kinematics: cartesian

max_velocity:2000
max_accel:60000

max_z_velocity:300
max_z_accel:300

minimum_cruise_ratio: 0

# =============================================================================
# STEPPER MOTORS
# =============================================================================


# -----------------------------------------------------------------------------
[stepper_x]
step_pin: PB0
dir_pin: !PC5               # Add ! to invert if motors fight each other
enable_pin: !PB1
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 0
position_endstop: 100        # Currently limmited to 100 due to a little issue , can be fixed with a future 3d printed part swap
position_max: 100       # Currently limmited to 100 due to a little issue , can be fixed with a future 3d printed part swap
homing_speed: 40
homing_retract_dist: 0     
homing_positive_dir: true 

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 1            
run_current: 1.4 # for ME, cold motors 0.8A , warm motors 1.4A , COOL THE MOTOROSSSSSS PLEASEEEEE 1.77A + 
stealthchop_threshold: 0
diag_pin: ^PC2
driver_SGTHRS: 80

# -----------------------------------------------------------------------------
[stepper_x1]
step_pin: PB3
dir_pin: PB4               # Add ! to invert direction if needed: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 40    


[tmc2209 stepper_x1]
uart_pin: PC11
tx_pin: PC10
uart_address: 3       
run_current: 1.4     # for ME, cold motors 0.8A , warm motors 1.4A , COOL THE MOTOROSSSSSS PLEASEEEEE 1.77A + 
stealthchop_threshold: 0   

# -----------------------------------------------------------------------------
[stepper_y]
step_pin: PB13
dir_pin: !PB12              # Add ! to invert direction if needed
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: -1
position_endstop: -0.2     
position_max: 180         
homing_speed: 40
homing_retract_dist: 0    
homing_positive_dir: false 

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2            
run_current: 1.7
stealthchop_threshold: 0
diag_pin: ^PC1
driver_SGTHRS: 80        # Tune this

# -----------------------------------------------------------------------------
[stepper_y1]
step_pin: PB10
dir_pin: PB2               # Add ! to invert if motors fight each other
enable_pin: !PB11
microsteps: 16
rotation_distance: 40

[tmc2209 stepper_y1]
uart_pin: PC11
tx_pin: PC10
uart_address: 0            
run_current: 1.4 # for ME, cold motors 0.8A , warm motors 1.4A , COOL THE MOTOROSSSSSS PLEASEEEEE 1.77A + 
stealthchop_threshold: 0
diag_pin: ^PC0

# =============================================================================

[stepper_z]
step_pin: mcu2:PB10
dir_pin: mcu2:PB2              
enable_pin: !mcu2:PB11
endstop_pin: ^mcu2:PC14        # Hahahaha, i added this so klipper stops being angry

rotation_distance:83.76
microsteps:32
full_steps_per_rotation: 200
                          
position_endstop:0                       # A Z endstop? We dont need that where we are going
position_min: -10
position_max: 10000             # YIPEEEEEEE ALLL THE Z! 
homing_speed: 10

[tmc2209 stepper_z]
uart_pin: mcu2:PC11
tx_pin: mcu2:PC10
uart_address: 0                
run_current: 0.900             # i found ths okay for the nema 14 i was using
stealthchop_threshold: 999999  # i used stealthchop, otherwise it was really loud


# =============================================================================
# EXTRUDER
# =============================================================================

[extruder]
step_pin: mcu2:PB13
dir_pin: mcu2:PB12             # Add ! to invert if needed
enable_pin: !mcu2:PB14
microsteps: 16
rotation_distance:2.816        # Calibrate for your specific extruder, i have a feeling my values are weird
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC9           
sensor_type: Generic 3950   # Change to match your thermistor
sensor_pin: PA0           
min_temp: 0
max_temp: 280
min_extrude_temp: 10
control: pid                   # Run PID_CALIBRATE HEATER=extruder TARGET=200
pid_Kp: 21.527                 
pid_Ki: 1.063
pid_Kd: 108.982

max_extrude_only_distance: 110

[tmc2209 extruder]
uart_pin: mcu2:PC11
tx_pin: mcu2:PC10
uart_address: 2               
run_current: 0.6            # depending on your E motor you might want more or less
stealthchop_threshold: 999999


# =============================================================================
# HEATED BED
# dont heat it up too much or you WILL have issues
# =============================================================================

[heater_bed]
heater_pin: PC8
sensor_type: Generic 3950
sensor_pin: PC4
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 50 #going past 50 softens my bed adhesives a bit tooo much


# =============================================================================
# FANSSSSSSSSS
# =============================================================================

[heater_fan hotend_fan]
pin: PC6
heater_temp: 50


[fan]
pin: PC7

# the SKR mini E3 V3s get TOASTY if you run them at 1.77A , a fan is NEEDED otherwise they will shut off
[fan_generic electronics]
pin: PB15



