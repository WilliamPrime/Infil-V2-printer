# See docs/Config_Reference.md for a description of parameters.

[include macros.cfg]
[include custom_macros.cfg]
[include homing_override.cfg]

[gcode_arcs]
resolution: 0.1


###################################################################################################################################################
###################################################################################################################################################
###################################################################################################################################################


[printer]
kinematics: cartesian

max_velocity:200
max_accel:20000

max_z_velocity:5
max_z_accel:500

minimum_cruise_ratio: 0

square_corner_velocity: 5.0


###################################################################################################################################################
###################################################################################################################################################
###################################################################################################################################################




#[temperature_sensor mcu_temp]
#sensor_type: temperature_mcu
#min_temp: 0
#max_temp: 100

[virtual_sdcard] 
path: ~/gcode_files

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_3E0023000E47323236333832-if00

[mcu rpi]
serial: /tmp/klipper_host_mcu

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100
########################
########################


###################################################################################################################################################
#################################### setting klipper stepper stuff ####################################
###################################################################################################################################################

[stepper_x]
step_pin:PC5
dir_pin:PC4             # chuck an ! if you need to flip
enable_pin:!PB0
rotation_distance:40
microsteps:32
full_steps_per_rotation: 200
step_pulse_duration: 0.000000100 #can maybe remove idk

endstop_pin:

position_min: 0
position_endstop:120
position_max:120

homing_speed: 5.0
homing_retract_dist: 0.0
#homing_retract_speed:
second_homing_speed:2

[stepper_x1]
step_pin:PA5
dir_pin:PA4          # chuck an ! if you need to flip
enable_pin:!PA6
rotation_distance:40
microsteps:32
full_steps_per_rotation: 200
step_pulse_duration: 0.000000100 #can maybe remove idk


[stepper_y]
step_pin:PA1
dir_pin:PA0             # chuck an ! if you need to flip
enable_pin:!PA2
rotation_distance:40
microsteps:32
full_steps_per_rotation: 200
step_pulse_duration: 0.000000100 #can maybe remove idk

endstop_pin:

position_min: 0
position_max:180 # might be able to be set to 186
position_endstop:180

homing_speed: 5.0
homing_retract_dist: 0.0
second_homing_speed:2


[stepper_y1]
step_pin:PC14
dir_pin: PC13           # chuck an ! if you need to flip
enable_pin:!PC15
rotation_distance:40
microsteps:32
full_steps_per_rotation: 200
step_pulse_duration: 0.000000100 #can maybe remove idk



[stepper_z]
step_pin: PB10            # chuck an ! if you need to flip
dir_pin:PB2
enable_pin:!PB11
rotation_distance:40
gear_ratio:90:20 #90t big pulley on bed, 20t pulley on motor
microsteps:32
full_steps_per_rotation: 200
step_pulse_duration: 0.000000100 #can maybe remove idk

endstop_pin:

position_min: 0
position_endstop:100
position_max:100

homing_speed: 5.0
homing_retract_dist: 0.0

###################################################################################################################################################
############### EXTRUDER ########################
###################################################################################################################################################

[extruder]
step_pin: PC12
dir_pin: PB5
enable_pin: !PC11
microsteps: 16
rotation_distance: 25.12
Gear_ratio: 44:10  , 37:18  # if this doesnt work just enter  407:45 or 9.0444

nozzle_diameter: 0.4
filament_diameter: 1.750

heater_pin: 
sensor_type: 
sensor_pin: 

control: pid
pid_Kp:
pid_Ki:
pid_Kd:
min_temp: 0
max_temp: 400
full_steps_per_rotation: 200
max_extrude_only_distance: 1000.0
max_extrude_cross_section: 500
max_extrude_only_velocity: 200
max_extrude_only_accel: 10000
min_extrude_temp: 180
pressure_advance: 0.02
pressure_advance_smooth_time: 0.03


###################################################################################################################################################
#################################### setting tmc stepper stuff , MOTOR CURRENTS ####################################
###################################################################################################################################################

[tmc5160 stepper_x] 
#spi_bus: 
cs_pin: PA7
#diag_pin: 
interpolate: false
run_current: 2
hold_current:1.9
stealthchop_threshold:0

sense_resistor: 0.033
spi_software_mosi_pin: PB5
spi_software_miso_pin: PB4
spi_software_sclk_pin: PB3 
#driver_SGT: -64 # -64 is most sensitive value, 63 is least sensitive
driver_TBL: 1
driver_TOFF: 3
driver_DISS2G: 1
driver_DISS2VS: 1

[tmc5160 stepper_x1] 
#spi_bus: 
cs_pin: PA3
#diag_pin: 
interpolate: false
run_current: 2
hold_current:1.9
stealthchop_threshold:0

sense_resistor: 0.033
spi_software_mosi_pin: PB5
spi_software_miso_pin: PB4
spi_software_sclk_pin: PB3 
#driver_SGT: -64 # -64 is most sensitive value, 63 is least sensitive
driver_TBL: 1
driver_TOFF: 3
driver_DISS2G: 1
driver_DISS2VS: 1

[tmc5160 stepper_y] 
#spi_bus: 
cs_pin: PC3
#diag_pin: 
interpolate: false
run_current: 2
hold_current:1.9
stealthchop_threshold:0

sense_resistor: 0.033
spi_software_mosi_pin: PB5
spi_software_miso_pin: PB4
spi_software_sclk_pin: PB3 
#driver_SGT: -64 # -64 is most sensitive value, 63 is least sensitive
driver_TBL: 1
driver_TOFF: 3
driver_DISS2G: 1
driver_DISS2VS: 1

[tmc5160 stepper_y1] 
#spi_bus: 
cs_pin: PB7
#diag_pin: 
interpolate: false
run_current: 2
hold_current:1.9
stealthchop_threshold:0

sense_resistor: 0.033
spi_software_mosi_pin: PB5
spi_software_miso_pin: PB4
spi_software_sclk_pin: PB3
#driver_SGT: -64 # -64 is most sensitive value, 63 is least sensitive
driver_TBL: 1
driver_TOFF: 3
driver_DISS2G: 1
driver_DISS2VS: 1

[tmc2209 stepper_z]
interpolate: false
uart_pin: PB1
run_current: 1.2
hold_current:0.4
stealthchop_threshold: 0

[tmc2209 extruder]
uart_pin: PB6
interpolate: false
run_current: 0.7
stealthchop_threshold:0

sense_resistor: 0.110




















































[stepper_y]
step_pin: PF6
dir_pin: PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1  #Y-Min, PJ0:Y-Max
position_endstop: 0
position_max: 360
homing_speed: 30

[stepper_z]
step_pin: PL3
dir_pin: !PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 48.324
endstop_pin: ^PD3  #Z-Min, PD2:Z-Max
position_endstop: 0
position_max: 99999
position_min: -3

[extruder]
step_pin: PA4
dir_pin: !PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 8.001438
nozzle_diameter: 0.4
filament_diameter: 1.750
heater_pin: PB4
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PK5
min_temp: 0
max_temp: 250
#control = pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982

[heater_bed]
heater_pin: PH5
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PK6
min_temp: 0
max_temp: 130
#control: pid
#pid_Kp: 325.10
#pid_Ki: 63.35
#pid_Kd: 417.10

[fan]
pin: PH6

[mcu]
serial:/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0

########################################
# TMC UART configuration
########################################

[tmc2209 stepper_x]
uart_pin: PK1
interpolate: True
run_current: 0.8
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 999999
diag_pin: ^PE5      # Set to MCU pin connected to TMC DIAG pin
driver_SGTHRS: 60   # 255 is most sensitive value, 0 is least sensitiv      # Set to MCU pin connected to TMC DIAG pin


[tmc2209 stepper_y]
uart_pin: PK2
interpolate: True
run_current: 0.8
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 999999
diag_pin: ^PJ1      # Set to MCU pin connected to TMC DIAG pin
driver_SGTHRS: 60  # 255 is most sensitive value, 0 is least sensitiv

[tmc2209 stepper_z]
uart_pin: PK3
interpolate: True
run_current: 0.8
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 999999
diag_pin: ^PD2     # Set to MCU pin connected to TMC DIAG pin
driver_SGTHRS: 255  # 255 is most sensitive value, 0 is least sensitiv

[tmc2209 extruder]
uart_pin: PK4
interpolate: True
run_current: 0.8
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 999999


[printer]
kinematics: corexy
max_velocity: 200
max_accel: 1500
max_z_velocity: 10
max_z_accel: 500
square_corner_velocity: 10.0

