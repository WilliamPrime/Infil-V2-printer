
[homing_override]
axes: xyz
set_position_z: 0
gcode:
    G90                         ; Absolute positioning
    G28 Y
    G0 Y10 F600
    G28 X}
    G0 X40 F6000


# =============================================================================
# MACROS
# =============================================================================
 
[gcode_macro PRINT_START]
gcode:
    G28                         ; Home all axes
    G90                         ; Absolute positioning
    G92 E0                      ; Reset extruder
 
[gcode_macro PRINT_END]
gcode:
    M104 S0                     ; Turn off extruder
    M140 S0                     ; Turn off bed
    M84                         ; Disable motors


    